<div
[ngClass]="cardClasses"

  [ngStyle]="{
    'border-left':
      course.gradeStatus === 'passed'
        ? '6px solid green'
        : course.gradeStatus === 'failed'
        ? '6px solid red'
        : '6px solid gray'
  }">

  <h3>{{ course.name }}</h3>

  <p>Code: {{ course.code }}</p>

  <p>Credits: {{ course.credits }}</p>

  <div [ngSwitch]="course.gradeStatus">

    <span *ngSwitchCase="'passed'" style="color: green;">
      Passed
    </span>

    <span *ngSwitchCase="'failed'" style="color: red;">
      Failed
    </span>

    <span *ngSwitchCase="'pending'" style="color: gray;">
      Pending
    </span>

  </div>

  <br>

  <button (click)="toggleEnrollment()">
  {{ enrollmentService.isEnrolled(course.id)
      ? 'Unenroll'
      : 'Enroll' }}
  </button>
  <br>

<button (click)="toggleDetails()">
  {{ isExpanded ? 'Hide Details' : 'Show Details' }}
</button>

<div *ngIf="isExpanded">

  <hr>

  <p><strong>Course ID:</strong> {{ course.id }}</p>

  <p><strong>Status:</strong> {{ course.gradeStatus }}</p>

</div>

</div>
